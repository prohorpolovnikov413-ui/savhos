<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Завхоз">
<meta name="theme-color" content="#2b1d14">
<title>Завхоз Слова жизни</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<header id="top">
  <div id="score"><span id="deeds">0</span><small>добрых дел</small></div>
  <div id="stats"><span>⚡ <b id="dps">0</b>/сек</span><span>👆 <b id="dpt">1</b></span><span>👥 <b id="people">3</b></span></div>
  <div id="loc"><span id="locName">Кабинет завхоза</span><div id="locBar"><i></i></div><small id="locNext"></small></div>
</header>
<main id="play">
  <div id="event" hidden></div>
  <button id="tap" aria-label="Нажимай!"><img src="img/tap.webp" alt="Церковь" draggable="false"></button>
  <div id="hint">Нажимай на церковь — делай добрые дела!</div>
</main>
<nav id="tabs">
  <button data-p="shop">🛠 Улучшения</button>
  <button data-p="ach">🏆 Достижения</button>
  <button data-p="info">ℹ️ Об игре</button>
</nav>
<section id="panel" hidden>
  <div class="ph"><b id="ptitle"></b><button id="pclose" aria-label="Закрыть">✕</button></div>
  <div id="pbody"></div>
</section>
<div id="toast"></div>
<div id="modal" hidden><div class="mbox"><div id="mtext"></div><button id="mok">Слава Богу! 🙏</button></div></div>
<script src="game.js"></script>
</body>
</html>
